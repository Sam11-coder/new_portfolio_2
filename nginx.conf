server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;   # don't advertise the nginx version

    # Security headers, sent with every response.
    # (The locations below only use "expires", never add_header, so they keep these.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Built JS and CSS have a hash in their file names, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The page itself: browsers always check for a new version, so a deploy shows up right away.
    location = /index.html {
        expires -1;
    }

    # Everything else (photo, resume, logo, robots.txt): cache for a day.
    # Unknown paths like /project/aws-... fall back to index.html so React Router can handle them.
    location / {
        try_files $uri $uri/ /index.html;
        expires 1d;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml text/xml image/svg+xml;
    gzip_min_length 256;
}
